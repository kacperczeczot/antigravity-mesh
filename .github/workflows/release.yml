name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        working-directory: apps/android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-assets
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk release-assets/AntigravityMesh.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-assets/AntigravityMesh.apk

  build-rust:
    name: Build Rust Daemon (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: agy-mesh-daemon-linux-x64
            target_file: apps/daemon-rs/target/release/daemon-rs
          - os: macos-latest
            artifact_name: agy-mesh-daemon-macos-arm64
            target_file: apps/daemon-rs/target/release/daemon-rs
          - os: windows-latest
            artifact_name: agy-mesh-daemon-windows-x64.exe
            target_file: apps/daemon-rs/target/release/daemon-rs.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - name: Build release binary
        working-directory: apps/daemon-rs
        run: |
          cargo build --release
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            codesign --force --sign - --entitlements assets/AntigravityMesh.entitlements target/release/daemon-rs
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.target_file }}

      - name: Build macOS App Bundle and DMG
        if: matrix.os == 'macos-latest'
        run: |
          APP_NAME="AntigravityMesh.app"
          rm -rf staging_dmg "$APP_NAME"
          mkdir -p "$APP_NAME/Contents/MacOS"
          mkdir -p "$APP_NAME/Contents/Resources"
          cp apps/daemon-rs/target/release/daemon-rs "$APP_NAME/Contents/MacOS/AntigravityMesh"
          chmod +x "$APP_NAME/Contents/MacOS/AntigravityMesh"
          cp apps/daemon-rs/assets/Info.plist "$APP_NAME/Contents/Info.plist"
          cp apps/daemon-rs/assets/AppIcon.icns "$APP_NAME/Contents/Resources/AppIcon.icns"
          codesign --force --deep --sign - --entitlements apps/daemon-rs/assets/AntigravityMesh.entitlements "$APP_NAME"

          mkdir -p staging_dmg
          cp -R "$APP_NAME" staging_dmg/
          ln -s /Applications staging_dmg/Applications
          hdiutil create -volname "Antigravity Mesh" -srcfolder staging_dmg -ov -format UDZO apps/daemon-rs/target/release/AntigravityMesh.dmg

      - name: Upload macOS DMG artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: apps/daemon-rs/target/release/AntigravityMesh.dmg

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-rust]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-assets

      - name: Flatten and Package Assets
        run: |
          mkdir -p release-files
          # Android APK
          cp all-assets/android-apk/*.apk release-files/AntigravityMesh.apk

          # Windows Direct EXE
          cp all-assets/agy-mesh-daemon-windows-x64.exe/daemon-rs.exe release-files/AntigravityMesh-Windows.exe

          # macOS DMG Installer
          cp all-assets/macos-dmg/AntigravityMesh.dmg release-files/AntigravityMesh.dmg

          # macOS Direct Binary
          chmod +x all-assets/agy-mesh-daemon-macos-arm64/daemon-rs
          cp all-assets/agy-mesh-daemon-macos-arm64/daemon-rs release-files/AntigravityMesh-macOS

          # Linux Direct Binary
          chmod +x all-assets/agy-mesh-daemon-linux-x64/daemon-rs
          cp all-assets/agy-mesh-daemon-linux-x64/daemon-rs release-files/AntigravityMesh-Linux

          # Generate update manifests
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          REPO="${{ github.repository }}"
          python3 -c "import json; v='$VERSION'; t='$TAG'; r='$REPO'; b=f'https://github.com/{r}/releases/download/{t}'; json.dump({'version': v, 'apkUrl': f'{b}/AntigravityMesh.apk', 'windowsUrl': f'{b}/AntigravityMesh-Windows.exe', 'macosUrl': f'{b}/AntigravityMesh.dmg', 'macosBinaryUrl': f'{b}/AntigravityMesh-macOS', 'linuxUrl': f'{b}/AntigravityMesh-Linux'}, open('release-files/android-latest.json', 'w'), indent=2)"
          cp release-files/android-latest.json release-files/latest.json

          # Generate rich release notes
          python3 scripts/build-release-notes.py "$REPO" "$TAG" > release-notes.md

          ls -la release-files/

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          name: Antigravity Mesh ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: false

