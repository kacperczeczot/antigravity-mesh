[package]
name = "daemon-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.33"
clap = { version = "4.5", features = ["derive"] }
tower-http = { version = "0.6", features = ["cors"] }
rand = "0.8"
walkdir = "2.5"

